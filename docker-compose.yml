services:
  db:
    image: mysql:8
    container_name: mysql_torneo
    command: --default-time-zone=-03:00
    environment:
      MYSQL_ROOT_PASSWORD: root1234
    ports:
      - "3307:3306"
    volumes:
      - ./db:/docker-entrypoint-initdb.d
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot1234"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: api_torneo
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: torneo_futbol5
      DB_USER: admin_torneo
      DB_PASSWORD: admin1234
      DB_PLANILLERO_USER: planillero_torneo
      DB_PLANILLERO_PASSWORD: planillero1234
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
