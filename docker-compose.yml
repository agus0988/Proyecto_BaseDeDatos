services:
  db:
    image: mysql:8
    container_name: mysql_torneo
    command: --default-time-zone=-03:00
    environment:
      MYSQL_ROOT_PASSWORD: root1234
    ports:
      - "3307:3306"
    volumes:
      - ./db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot1234"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: python:3.12-slim
    container_name: api_torneo
    working_dir: /app/python
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: torneo_futbol5
      DB_USER: admin_torneo
      DB_PASSWORD: admin1234
      DB_PLANILLERO_USER: planillero_torneo
      DB_PLANILLERO_PASSWORD: planillero1234
    command: sh -c "pip install -q -r ../requirements.txt && uvicorn api:app --host 0.0.0.0 --port 8000"
    depends_on:
      db:
        condition: service_healthy
